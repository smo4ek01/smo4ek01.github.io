<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:locale" content="en"/>
    <meta property="og:title" content="smo4ek"/>
    <meta property="og:description" content=";)"/>
    <meta property="og:image" content="https://sevcator.github.io/materials/unnamed.jpg"/>
    <title>smo4ek</title>
    <link rel="icon" href="materials/website.ico" type="image/x-icon"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Заменено для правильного скролла */
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
            position: relative;
            background-image: url(materials/background.gif);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            text-align: center;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 1;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
            background-color: #ddd;
            z-index: 2;
        }
        .name {
            font-size: 24px;
            color: #fff;
            margin: 10px 0;
            z-index: 2;
        }
        .bio-container {
            z-index: 2;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .bio {
            font-size: 16px;
            color: #fff;
            margin-bottom: 20px;
            z-index: 2;
            position: relative;
        }
        .button-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            z-index: 2;
            position: relative;
        }
        
        /* СТИЛИ КНОПОК ИЗ ПЕРВОЙ ВЕРСИИ */
        .button, .button2, .copy-button {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .button img, .button2 img, .copy-button img {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            transition: transform 0.3s ease;
        }
        
        /* ЭФФЕКТЫ ПРИ НАВЕДЕНИИ (HOVER) ИЗ ПЕРВОЙ ВЕРСИИ */
        .button:hover, .button2:hover, .copy-button:hover {
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.9);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 255, 255, 0.2);
        }
        
        .button:hover img, .button2:hover img, .copy-button:hover img {
            transform: scale(1.15) rotate(-5deg);
        }

        .button:active, .copy-button:active, .button2:active {
            transform: translateY(-1px) scale(0.98);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .bio-expanded {
            display: none;
            z-index: 2;
        }
        .bio-expanded.show {
            display: block;
            z-index: 2;
        }
        .expand-bio {
            text-decoration: none;
            color: #fff;
            cursor: pointer;
            z-index: 2;
        }
        .expand-bio:hover {
            text-decoration: underline;
            z-index: 2;
        }
        .bio-expanded {
            white-space: pre-wrap;
            z-index: 2;
        }
        
        /* БЛОК GIF-БАННЕРА */
        .banner-container {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            width: 100%;
            z-index: 2;
            animation: fadeIn 1s ease-in-out;
        }
        .banner-container img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .banner-container img:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.7);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Мобильная адаптация из первой версии */
        @media (max-width: 768px) {
            .avatar {
                width: 160px;
                height: 160px;
            }
            .name {
                font-size: 40px;
            }
            .bio {
                font-size: 16px;
            }
            .button, .button2, .copy-button {
                font-size: 28px;
                padding: 5px 13px;
            }
            .button-container {
                flex-direction: column;
                gap: 8px;
            }
        }
        @media (max-width: 480px) {
            .avatar {
                width: 120px;
                height: 120px;
            }
            .name {
                font-size: 36px;
            }
            .bio {
                font-size: 16px;
            }
            .button, .button2, .copy-button {
                font-size: 24px;
                padding: 5px 13px;
            }
        }
    </style>
</head>
<body>
    <img src="materials/avatar.png" alt="Avatar" class="avatar">
    <div class="name">smo4ek</div>
    <div class="bio-container">
        <div class="bio">
            Toy. Current my time: <span id="time"></span>
            <br><br>
            <a href="#" class="expand-bio">More...</a>
            <span class="bio-expanded">From Russian Federation, Male

Happy Sugar Life, Touhou Project &lt;3</span>
        </div>
        <div class="button-container">
            <a href="https://t.me/smo4ek" class="button2">
                <img src="materials/telegram.png" alt="Telegram">t.me/smo4ek
            </a>
            <a href="https://www.youtube.com/@smo4ek-u7h9s" class="button">
                <img src="materials/youtube.png" alt="YouTube">YouTube
            </a>
            <a class="copy-button" onclick="copyToClipboard('smo4ek#3212')">
                <img src="materials/discord.png" alt="Discord">Discord
            </a>
            <a href="https://tiktok.com/@smo4ek01" class="button2">
                <img src="materials/tiktok.png" alt="TikTok">smo4ek01
            </a>   
            <a href="https://github.com/smo4ek01" class="button2">
                <img src="materials/github.png" alt="GitHub">GitHub
            </a>
            <a href="https://steamcommunity.com/profiles/76561198777381803/" class="button2">
                <img src="materials/steam.png" alt="Steam">Steam
            </a>
        </div>
        
        <!-- GIF Баннер MyNickname -->
        <div class="banner-container">
            <a href="https://mynickname.com/id1842501" target="_blank">
                <img src="https://mynickname.com/forum/smo4ek.gif" alt="Никнейм smo4ek" border="0" />
            </a>
        </div>
    </div>

    <script>
        const expandBioButton = document.querySelector('.expand-bio');
        const bioExpanded = document.querySelector('.bio-expanded');

        expandBioButton.addEventListener('click', (e) => {
            e.preventDefault();
            bioExpanded.classList.toggle('show');
            expandBioButton.textContent = bioExpanded.classList.contains('show') ? 'Minimize' : 'More...';
        });
        
        function copyToClipboard(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            alert('Discord username copied to clipboard!');
        }

        function updateTime() {
            const options = { timeZone: 'Europe/Moscow', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('time').textContent = new Date().toLocaleTimeString('en-GB', options);
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
